name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Resolve remote package + build Demo for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Resolve package dependencies (from GitHub, exactly the Package.resolved revision)
        run: xcodebuild -resolvePackageDependencies -project Demo.xcodeproj -scheme Demo -onlyUsePackageVersionsFromResolvedFile
      - name: Build (compile-only, no device needed)
        run: |
          xcodebuild build \
            -project Demo.xcodeproj \
            -scheme Demo \
            -destination 'generic/platform=iOS Simulator' \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO
          # Warnings-as-errors is set on the Demo target itself (project.pbxproj), not here:
          # a command-line SWIFT_TREAT_WARNINGS_AS_ERRORS=YES also reaches the remote package
          # target, which Xcode compiles with -suppress-warnings, and the two flags conflict.
